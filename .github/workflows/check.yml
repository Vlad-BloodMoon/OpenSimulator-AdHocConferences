name: Prototype checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-and-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: TEST_ROOT_PASSWORD_ONLY
          MYSQL_DATABASE: opensim_adhoc
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pTEST_ROOT_PASSWORD_ONLY"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP MySQL driver and client
        run: |
          sudo apt-get update
          sudo apt-get install -y php-mysql mysql-client
      - name: PHP syntax
        run: |
          php -l web/conferences.php
          php -l web/config.php.example
          php -l web/wolf_api.php
          php -l web/wolf_config.php.example
          php -l tests/wolf_config.test.php
      - name: HMAC protocol vectors
        run: node tests/hmac-vectors.mjs
      - name: PHP + MySQL conference lifecycle
        run: |
          MYSQL_PWD=TEST_ROOT_PASSWORD_ONLY mysql -h 127.0.0.1 -uroot opensim_adhoc < database/wolf_schema.sql
          cp tests/wolf_config.test.php web/wolf_config.php
          php -S 127.0.0.1:8787 -t web >/tmp/wolf-api-test.log 2>&1 &
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/wolf_api.php || true)
            if [ "$code" = "405" ]; then break; fi
            sleep 0.2
          done
          node tests/integration.mjs

  opensim-csharp-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out conference patches
        uses: actions/checkout@v4
      - name: Check out OpenSimulator source
        uses: actions/checkout@v4
        with:
          repository: Vlad-BloodMoon/opensim
          ref: v0.9.3.1-webrtc.2
          path: opensim
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Apply WolfConference patch
        run: git -C opensim apply ../patches/wolfconference-voice-key-and-root.patch
      - name: Apply multi-avatar IM diagnostics
        run: git -C opensim apply --check ../patches/wolfconference-text-diagnostics.patch && git -C opensim apply ../patches/wolfconference-text-diagnostics.patch
      - name: Apply conference IM entry guard correction
        run: git -C opensim apply --check ../patches/wolfconference-text-entry.patch && git -C opensim apply ../patches/wolfconference-text-entry.patch
      - name: Prevent duplicate sender echo in multi-avatar conference IM
        run: git -C opensim apply --check ../patches/wolfconference-text-no-self-echo.patch && git -C opensim apply ../patches/wolfconference-text-no-self-echo.patch
      - name: Prevent recursive ad-hoc voice conference invitations
        run: git -C opensim apply --check ../patches/wolfconference-voice-invite-loop.patch && git -C opensim apply ../patches/wolfconference-voice-invite-loop.patch
      - name: Generate OpenSimulator projects
        working-directory: opensim
        run: ./runprebuild.sh
      - name: Compile OpenSimulator (Release)
        working-directory: opensim
        run: dotnet build --configuration Release OpenSim.sln
      - name: Verify patched module output
        run: test -s opensim/bin/WebRtcVoiceRegionModule.dll
      - name: Upload patched module for test
        uses: actions/upload-artifact@v4
        with:
          name: WebRtcVoiceRegionModule-adhoc-VOICE-LOOP-TEST-0.9.3.1
          path: |
            opensim/bin/WebRtcVoiceRegionModule.dll
            opensim/bin/WebRtcVoiceRegionModule.pdb
          if-no-files-found: error
          retention-days: 7
