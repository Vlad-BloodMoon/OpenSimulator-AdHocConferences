name: Publish v0.1.0 tested WolfVoice conference release

# One-time initial release: creating this workflow file publishes the validated
# DLL from the successful, pre-existing CI run #30. Subsequent normal commits
# do not republish this release.
on:
  push:
    paths:
      - .github/workflows/publish-release.yml

permissions:
  contents: write
  actions: read

jobs:
  publish-tested-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the documented release source
        uses: actions/checkout@v4

      - name: Download validated OpenSimulator module from successful build #30
        uses: actions/download-artifact@v4
        with:
          name: WebRtcVoiceRegionModule-adhoc-NOTIFY-FIX-TEST-0.9.3.1
          run-id: 42395627678
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: tested-module

      - name: Verify the downloaded module and package reproducible release ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -s tested-module/WebRtcVoiceRegionModule.dll
          test -s tested-module/WebRtcVoiceRegionModule.pdb
          zip -j -9 WebRtcVoiceRegionModule-AdHocConferences-0.9.3.1-v0.1.0.zip \
            tested-module/WebRtcVoiceRegionModule.dll \
            tested-module/WebRtcVoiceRegionModule.pdb
          sha256sum WebRtcVoiceRegionModule-AdHocConferences-0.9.3.1-v0.1.0.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create public GitHub release and tag from verified binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo "Release v0.1.0 already exists; refusing to silently overwrite assets"
            exit 1
          fi
          gh release create v0.1.0 \
            WebRtcVoiceRegionModule-AdHocConferences-0.9.3.1-v0.1.0.zip \
            SHA256SUMS.txt \
            --title "v0.1.0 – OpenSimulator Ad-Hoc IM + WolfVoice WebRTC conferences" \
            --notes-file RELEASE_NOTES.md \
            --target "${GITHUB_SHA}" \
            --latest
